# Site compilé servi par nginx (image Docker du frontend, V8.4).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Mêmes en-têtes que « npm run preview » : garder cette CSP identique à celle de frontend/vite.config.ts.
    # « always » : aussi sur les pages d'erreur.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://data.geopf.fr; connect-src http://localhost:8000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri /index.html;
    }
}
